apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-demo-app
  namespace: devops-demo
  labels:
    app: cloud-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-demo-app
  template:
    metadata:
      labels:
        app: cloud-demo-app
    spec:
      containers:
      - name: cloud-demo-app
        # Replace <DOCKERHUB_USERNAME> with your Docker Hub ID
        image: <DOCKERHUB_USERNAME>/cloud-demo-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /api/tasks/version
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/tasks/version
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 15